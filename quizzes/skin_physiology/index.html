function shuffleArr(a){
  var b=a.slice();
  for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t}
  return b;
}

var shuffledQS=buildQuestionOrder();
var cur=0,score=0,answered=false;
var catScores={};
function resetCatScores(list){
  CATS.forEach(function(c){catScores[c.id]={ok:0,tot:0}});
  list.forEach(function(q){if(catScores[q.cat])catScores[q.cat].tot++});
}
resetCatScores(shuffledQS);
function getCat(id){return CATS.find(function(c){return c.id===id})}
function setProgress(n,t){document.getElementById('prog-fill').style.width=(n/t*100)+'%'}

function getDifficulty(q){
  if(q.level)return q.level;
  if(q.difficulty==='basic')return 1;
  if(q.difficulty==='advanced'||q.difficulty==='clinical')return 3;
  return 2;
}
function buildQuestionOrder(){
  var levels=[1,2,3];
  var result=[];
  levels.forEach(function(level){
    result=result.concat(shuffleArr(QS.filter(function(q){return getDifficulty(q)===level})));
  });
  return result;
}

function errorsKey(){return 'quiz-errors:'+location.pathname}
function questionId(q){return q.q}
function getStoredErrors(){
  try{return JSON.parse(localStorage.getItem(errorsKey())||'[]')}catch(e){return []}
}
function saveStoredErrors(ids){
  localStorage.setItem(errorsKey(),JSON.stringify(ids));
}
function rememberError(q){
  var ids=getStoredErrors();
  var id=questionId(q);
  if(ids.indexOf(id)===-1){ids.push(id);saveStoredErrors(ids)}
}
function forgetError(q){
  var id=questionId(q);
  var ids=getStoredErrors().filter(function(x){return x!==id});
  saveStoredErrors(ids);
}
function getErrorQuestions(){
  var ids=getStoredErrors();
  return QS.filter(function(q){return ids.indexOf(questionId(q))>-1});
}
function startErrorReview(){
  var list=getErrorQuestions();
  if(!list.length)return;
  shuffledQS=shuffleArr(list);
  cur=0;score=0;answered=false;
  resetCatScores(shuffledQS);
  document.getElementById('result-box').style.display='none';
  document.getElementById('quiz-area').style.display='block';
  setProgress(0,shuffledQS.length);
  showQ();
}
function renderErrorReviewButton(){
  var restart=document.getElementById('restart-btn');
  var old=document.getElementById('errors-btn');
  if(old)old.remove();
  var list=getErrorQuestions();
  if(!list.length)return;
  var btn=document.createElement('button');
  btn.className='button primary';
  btn.id='errors-btn';
  btn.type='button';
  btn.textContent='Повторить ошибки ('+list.length+')';
  btn.addEventListener('click',startErrorReview);
  restart.parentNode.insertBefore(btn,restart);
}
var currentCorrectIdx=0;
var currentCorrectSet=[];
var currentIsMulti=false;

function isMultiQuestion(q){
  return Array.isArray(q.correct);
}

function optionText(item){
  return (item&&typeof item==='object')?item.text:item;
}

function wrongReason(q,value){
  var found=(q.wrong||[]).find(function(item){return item&&typeof item==='object'&&item.text===value});
  return found&&found.reason?found.reason:'';
}

function sameSet(a,b){
  if(a.length!==b.length)return false;
  var map={};
  a.forEach(function(x){map[x]=true});
  return b.every(function(x){return map[x]});
}

function finishAnswer(isCorrect, chosenValues){
  if(answered)return;
  answered=true;
  var q=shuffledQS[cur];
  var allBtns=document.querySelectorAll('.opt');
  allBtns.forEach(function(b){
    b.disabled=true;
    var isRight=currentCorrectSet.indexOf(b.dataset.value)>-1;
    var isChosen=chosenValues.indexOf(b.dataset.value)>-1;
    if(isRight)b.classList.add('correct');
    if(isChosen&&!isRight)b.classList.add('wrong');
  });
  var checkBtn=document.querySelector('.quiz-check-btn');
  if(checkBtn)checkBtn.disabled=true;
  if(isCorrect){score++;catScores[q.cat].ok++;forgetError(q)}else{rememberError(q)}
  var expBox=document.getElementById('exp-box');
  expBox.textContent=q.exp;
  if(!isCorrect){
    var reasons=chosenValues.map(function(v){return wrongReason(q,v)}).filter(Boolean);
    if(reasons.length){
      expBox.textContent+='\n\nПочему выбранный вариант неверен: '+reasons.join(' ');
    }
  }
  expBox.style.display='block';
  document.getElementById('next-btn').style.display='inline-block';
}

function showQ(){
  var q=shuffledQS[cur];
  var cat=getCat(q.cat);
  var badge=document.getElementById('cat-badge');
  badge.textContent=cat.name;
  badge.style.background=cat.bg;
  badge.style.color=cat.color;
  document.getElementById('counter').textContent='Вопрос '+(cur+1)+' из '+shuffledQS.length;
  document.getElementById('qtext').textContent=q.q;
  var expBox=document.getElementById('exp-box');
  expBox.style.display='none';
  expBox.textContent=q.exp;
  var nextBtn=document.getElementById('next-btn');
  nextBtn.style.display='none';
  nextBtn.textContent=(cur===shuffledQS.length-1)?'Посмотреть результаты →':'Следующий вопрос →';

  currentIsMulti=isMultiQuestion(q);
  currentCorrectSet=currentIsMulti?q.correct.slice():[q.correct];
  var opts=(currentIsMulti?q.correct:q.correct?[q.correct]:[]).concat(q.wrong||[]);
  var shuffledOpts=shuffleArr(opts);
  currentCorrectIdx=shuffledOpts.indexOf(q.correct);

  var optsDiv=document.getElementById('options');
  optsDiv.innerHTML='';
  if(currentIsMulti){
    var hint=document.createElement('div');
    hint.className='multi-hint';
    hint.textContent='Выберите все подходящие варианты';
    optsDiv.appendChild(hint);
  }
  shuffledOpts.forEach(function(txt,i){
    var btn=document.createElement('button');
    btn.className=currentIsMulti?'opt multi-opt':'opt';
    var label=optionText(txt);
    btn.textContent=label;
    btn.dataset.idx=i;
    btn.dataset.value=label;
    optsDiv.appendChild(btn);
  });
  if(currentIsMulti){
    var check=document.createElement('button');
    check.className='button primary quiz-check-btn';
    check.type='button';
    check.textContent='Проверить ответ';
    check.disabled=true;
    optsDiv.appendChild(check);
  }
  answered=false;
}

document.getElementById('options').addEventListener('click',function(e){
  var checkBtn=e.target.closest('.quiz-check-btn');
  if(checkBtn){
    if(answered||checkBtn.disabled)return;
    var selected=Array.prototype.slice.call(document.querySelectorAll('.opt.selected')).map(function(b){return b.dataset.value});
    finishAnswer(sameSet(selected,currentCorrectSet),selected);
    return;
  }

  var btn=e.target.closest('.opt');
  if(!btn||answered)return;

  if(currentIsMulti){
    btn.classList.toggle('selected');
    var anySelected=document.querySelectorAll('.opt.selected').length>0;
    var check=document.querySelector('.quiz-check-btn');
    if(check)check.disabled=!anySelected;
    return;
  }

  var chosen=[btn.dataset.value];
  finishAnswer(chosen[0]===currentCorrectSet[0],chosen);
});

document.getElementById('next-btn').addEventListener('click',function(){
  cur++;
  if(cur>=shuffledQS.length){showResults();return}
  setProgress(cur,shuffledQS.length);
  showQ();
});

document.getElementById('restart-btn').addEventListener('click',function(){
  cur=0;score=0;answered=false;
  shuffledQS=buildQuestionOrder();
  resetCatScores(shuffledQS);
  document.getElementById('result-box').style.display='none';
  document.getElementById('quiz-area').style.display='block';
  setProgress(0,shuffledQS.length);
  showQ();
});

function showResults(){
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('result-box').style.display='block';
  setProgress(shuffledQS.length,shuffledQS.length);
  var total=shuffledQS.length;
  var pct=Math.round(score/total*100);
  var grades=[
    {min:90,txt:'Отлично — чувствуешь кожу как орган!',col:'#2d7a2d'},
    {min:75,txt:'Хорошо — крепкая база',col:'#BA7517'},
    {min:60,txt:'Удовлетворительно — есть зоны для повторения',col:'#534AB7'},
    {min:0, txt:'Нужно повторить — кожа сложнее, чем кажется',col:'#993C1D'}
  ];
  var g=grades.find(function(x){return pct>=x.min});
  document.getElementById('res-sub').textContent=g.txt;
  document.getElementById('res-sub').style.color=g.col;
  document.getElementById('sc-ok').textContent=score;
  document.getElementById('sc-err').textContent=total-score;
  document.getElementById('sc-pct').textContent=pct+'%';
  var cr=document.getElementById('cat-results');
  cr.innerHTML='';
  CATS.forEach(function(cat){
    var s=catScores[cat.id];
    if(!s||s.tot===0)return;
    var p=Math.round(s.ok/s.tot*100);
    var row=document.createElement('div');
    row.className='cat-row';
    row.innerHTML='<span class="cr-name">'+cat.name+'</span>'
      +'<div class="cr-bar-bg"><div class="cr-bar" style="width:'+p+'%;background:'+cat.color+'"></div></div>'
      +'<span class="cr-val">'+s.ok+'/'+s.tot+'</span>';
    cr.appendChild(row);
  });
  renderErrorReviewButton();
}

showQ();
    </script>
