name: Update services YML feed

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'services/**'
      - 'assets/services/**'
      - 'tools/generate-services-feed.py'
      - '.github/workflows/update-services-feed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate services-feed.xml
        run: python3 tools/generate-services-feed.py

      - name: Commit generated feed if changed
        run: |
          if git diff --quiet -- services-feed.xml; then
            echo "services-feed.xml is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services-feed.xml
          git commit -m "Update services YML feed"
          git push
