name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate services-feed.xml
        run: python3 tools/generate-services-feed.py

      - name: Generate sitemap.xml
        run: python3 tools/generate-sitemap.py

      - name: Prepare static site artifact
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude .git/ \
            --exclude .github/ \
            --exclude .DS_Store \
            --exclude .local/ \
            --exclude _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
