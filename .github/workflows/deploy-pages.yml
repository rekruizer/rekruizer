name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [site-content-updated]
  schedule:
    # Cloudflare refreshes at 04:40 Moscow time. GitHub reads the completed
    # snapshot 30 minutes later and never calls the Worker's admin refresh.
    - cron: "10 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_final.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes webp pngquant

      - name: Convert service PNG sources to WebP
        run: python3 tools/convert-service-images.py

      - name: Read and validate services catalogue
        env:
          SERVICES_CATALOG_READ_TOKEN: ${{ secrets.SERVICES_CATALOG_READ_TOKEN }}
        # An unknown or replaced provider service must not block unrelated site
        # deployments. The sync script keeps the last validated snapshot and
        # adds a visible warning to this run instead.
        run: python3 tools/sync-services-catalog.py

      - name: Generate services-feed.xml
        run: python3 tools/generate-services-feed.py

      - name: Generate meta-services-feed.xml and PNG images
        run: python3 tools/generate-meta-services-feed.py

      - name: Build Astro site
        run: npm run build

      - name: Generate sitemap.xml
        run: python3 tools/generate-sitemap.py

      - name: Verify generated site, services and feeds
        run: |
          npm run check
          npm run test:seo
          npm run test:education
          python3 tools/test-services-catalog.py
          python3 tools/test-catalog-lifecycle.py
          python3 tools/test-astro-site.py
          python3 tools/test-legal-documents.py

      - name: Minify CSS and JS
        run: |
          npx --yes esbuild@0.27.2 dist/assets/site.css --minify --outfile=dist/assets/site.css --allow-overwrite
          npx --yes esbuild@0.27.2 dist/assets/site.js --minify --outfile=dist/assets/site.js --allow-overwrite

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        # Pages can briefly miss a freshly uploaded artifact; retry publication, not validation.
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Wait before second Pages attempt
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Deploy to GitHub Pages (attempt 2 of 3)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Wait before final Pages attempt
        if: steps.deployment_retry.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 3 of 3)
        id: deployment_final
        if: steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Report Pages retry recovery
        if: steps.deployment.outcome == 'failure'
        run: echo 'GitHub Pages publication succeeded after retrying the same validated artifact.' >> "$GITHUB_STEP_SUMMARY"
