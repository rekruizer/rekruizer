name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Cloudflare refreshes at 04:20 Moscow time. GitHub reads the completed
    # snapshot 50 minutes later and never calls the Worker's admin refresh.
    - cron: "10 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read and validate services catalogue
        env:
          SERVICES_CATALOG_READ_TOKEN: ${{ secrets.SERVICES_CATALOG_READ_TOKEN }}
        # An unknown or replaced DIKIDI service must not block unrelated site
        # deployments. The sync script keeps the last validated snapshot and
        # adds a visible warning to this run instead.
        run: python3 tools/sync-services-catalog.py

      - name: Render services into static pages
        run: python3 tools/generate-services-site.py

      - name: Generate services-feed.xml
        run: python3 tools/generate-services-feed.py

      - name: Verify generated services and feed
        run: python3 tools/test-services-catalog.py

      - name: Generate sitemap.xml
        run: python3 tools/generate-sitemap.py

      - name: Prepare static site artifact
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude .git/ \
            --exclude .github/ \
            --exclude .DS_Store \
            --exclude .local/ \
            --exclude _site/

      - name: Minify CSS and JS
        run: |
          npx --yes esbuild@0.27.2 _site/assets/site.css --minify --outfile=_site/assets/site.css --allow-overwrite
          npx --yes esbuild@0.27.2 _site/assets/site.js --minify --outfile=_site/assets/site.js --allow-overwrite

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
