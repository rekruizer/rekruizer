name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Cloudflare refreshes at 04:20 Moscow time. GitHub reads the completed
    # snapshot 50 minutes later and never calls the Worker's admin refresh.
    - cron: "10 2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate services catalogue
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            python3 tools/sync-services-catalog.py
          else
            python3 tools/sync-services-catalog.py --require-remote
          fi

      - name: Render services into static pages
        run: python3 tools/generate-services-site.py

      - name: Generate services-feed.xml
        run: python3 tools/generate-services-feed.py

      - name: Verify generated services and feed
        run: python3 tools/test-services-catalog.py

      - name: Generate sitemap.xml
        run: python3 tools/generate-sitemap.py

      - name: Save a new verified services snapshot
        run: |
          git add \
            assets/data/services-catalog.json \
            assets/services/catalog/ \
            index.html \
            services/
          if git diff --cached --quiet; then
            echo "Services have not changed — this is normal."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync services from DIKIDI catalogue"
            git push
          fi

      - name: Prepare static site artifact
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude .git/ \
            --exclude .github/ \
            --exclude .DS_Store \
            --exclude .local/ \
            --exclude _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
