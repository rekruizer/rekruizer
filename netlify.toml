[build]
  command = "python3 tools/generate-services-feed.py && python3 tools/generate-sitemap.py"
  publish = "."

[[redirects]]
  from = "/api/reviews"
  to = "https://denisyuce-reviews.den100hero.workers.dev/api/reviews"
  status = 200
  force = true

[[redirects]]
  from = "/url/*"
  to = "https://denisyuce-links.den100hero.workers.dev/url/:splat"
  status = 200
  force = true
